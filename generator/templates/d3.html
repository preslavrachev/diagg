<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{.Title}}</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #graph {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: move;
        }

        .node text {
            font-size: 12px;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .link.dependency {
            stroke-width: 2px;
        }

        .link.implementation {
            stroke-width: 1.5px;
            stroke-dasharray: 5,5;
        }

        .link.package-anchor {
            stroke: none;
            stroke-opacity: 0;
        }

        .package-hull {
            fill-opacity: 0.2;
            stroke-opacity: 0.6;
            stroke-width: 3px;
        }

        .package-label {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }

        .package-highlight-circle {
            fill-opacity: 0.1;
            stroke-opacity: 0.5;
            stroke-width: 2px;
        }

        /* Arrow markers */
        marker {
            fill: #999;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 40px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ddd;
        }
    </style>
</head>
<body>
    <h1>{{.Title}}</h1>
    <svg id="graph"></svg>

    <div class="legend" id="legend">
        <div><strong>Packages</strong></div>
    </div>

    <script>
        const data = {{.GraphJSON}};
        const colors = {{.ColorsJSON}};
        const viewMode = "{{.ViewMode}}";
        const isPackageView = viewMode === "package";

        // Set up SVG
        const width = window.innerWidth - 40;
        const height = window.innerHeight - 100;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height]);

        // Add zoom behavior
        const g = svg.append("g");
        svg.call(d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform)));

        // Define arrow markers for directed edges
        svg.append("defs").selectAll("marker")
            .data(["dependency", "implementation"])
            .join("marker")
            .attr("id", d => "arrow-" + d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", {{.ArrowMarkerSize}})
            .attr("markerHeight", {{.ArrowMarkerSize}})
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");

        // Color scale by package (not type)
        const packages = [...new Set(data.nodes.map(n => n.package))];
        const packageColorMap = {};
        packages.forEach((pkg, i) => {
            packageColorMap[pkg] = colors[i % colors.length];
        });

        const colorScale = (pkg) => packageColorMap[pkg] || "#999";

        // AIDEV-NOTE: package-clustering - Create invisible anchor nodes for each package
        // These anchors pull components of the same package together via invisible links
        const packageAnchors = isPackageView ? [] : packages.map(pkg => ({
            id: `__anchor_${pkg}`,
            package: pkg,
            isAnchor: true,
            size: 0,
            name: "",
            type: "",
            role: ""
        }));

        // Add anchors to nodes array
        const allNodes = [...data.nodes, ...packageAnchors];

        // Create invisible links from each component to its package anchor
        const packageLinks = isPackageView ? [] : data.nodes.map(node => ({
            source: node.id,
            target: `__anchor_${node.package}`,
            type: "package-anchor"
        }));

        // Combine all links
        const allLinks = [...data.links, ...packageLinks];

        // Build dynamic legend
        const legend = d3.select("#legend");

        // Add ENTRYPOINT first if it exists
        const hasEntrypoint = !isPackageView && data.nodes.some(n => n.type === "ENTRYPOINT");
        if (hasEntrypoint) {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", "#dc3545")
                .style("border-radius", "2px");
            item.append("span").text("entrypoint").style("font-weight", "bold");
        }

        // Add package colors
        packages.filter(pkg => isPackageView || pkg !== "main").forEach((pkg, i) => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", colors[i % colors.length]);
            item.append("span").text(pkg);
        });

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function normalize(value, maxValue) {
            if (maxValue <= 0) {
                return 0;
            }
            return value / maxValue;
        }

        // Build adaptive layout parameters from graph size and density.
        const visibleLinks = allLinks.filter(d => d.type !== "package-anchor");
        const visibleNodes = allNodes.filter(d => !d.isAnchor);

        // AIDEV-NOTE: layout-optimization; derive centrality from current graph edges to drive core-periphery layout
        const inboundCounts = new Map();
        const outboundCounts = new Map();

        visibleNodes.forEach((node) => {
            inboundCounts.set(node.id, 0);
            outboundCounts.set(node.id, 0);
        });

        visibleLinks.forEach((link) => {
            const sourceID = typeof link.source === "object" ? link.source.id : link.source;
            const targetID = typeof link.target === "object" ? link.target.id : link.target;
            outboundCounts.set(sourceID, (outboundCounts.get(sourceID) || 0) + 1);
            inboundCounts.set(targetID, (inboundCounts.get(targetID) || 0) + 1);
        });

        visibleNodes.forEach((node) => {
            const inDegree = inboundCounts.get(node.id) || 0;
            const outDegree = outboundCounts.get(node.id) || 0;
            const graphDegree = inDegree + outDegree;
            node.inDegree = inDegree;
            node.outDegree = outDegree;
            node.degree = Math.max(node.degree || 0, graphDegree);
        });

        const nodeCount = Math.max(1, data.nodes.length);
        const edgeCount = visibleLinks.length;
        const density = nodeCount > 1 ? edgeCount / (nodeCount * (nodeCount - 1)) : 0;
        const avgDegree = (2 * edgeCount) / nodeCount;
        const maxDegree = d3.max(visibleNodes, d => d.degree || 0) || 1;
        const degreeValuesDesc = visibleNodes
            .map(d => d.degree || 0)
            .sort((a, b) => b - a);
        const coreIndex = Math.max(0, Math.min(
            degreeValuesDesc.length - 1,
            Math.floor(degreeValuesDesc.length * 0.3)
        ));
        const coreCutoff = degreeValuesDesc[coreIndex] || 0;

        const minDimension = Math.min(width, height);
        const minOuter = minDimension * 0.08;
        const maxOuter = minDimension * 0.48;

        visibleNodes.forEach((node) => {
            const centrality = Math.pow(normalize(node.degree || 0, maxDegree), 0.8);
            node.centrality = centrality;
            node.ringRadius = maxOuter - centrality * (maxOuter - minOuter);
            node.isCore = (node.degree || 0) >= coreCutoff;

            // Entrypoints are operationally central; keep them closer to the core.
            if (node.type === "ENTRYPOINT") {
                node.ringRadius = Math.max(minOuter * 0.8, node.ringRadius * 0.75);
                node.isCore = true;
            }

            if (node.role === "hub") {
                node.ringRadius = Math.max(0, node.ringRadius * 0.45);
                node.isCore = true;
            } else if (node.role === "central") {
                node.ringRadius *= 0.75;
            } else if (node.role === "leaf") {
                node.ringRadius = Math.min(maxOuter, node.ringRadius * 1.2);
            }

            node.renderSize = clamp(
                node.size * (0.85 + centrality * 1.65),
                node.size,
                node.size * 3
            );
        });

        const maxNodeSize = d3.max(visibleNodes, d => d.renderSize || d.size) || 10;

        const spreadFactor = clamp(
            1 + (nodeCount / 18) + (density * 2.5) + (avgDegree / 6),
            1.0,
            4.0
        );

        const adaptiveLinkDistance = Math.round(clamp({{.LinkDistance}} * spreadFactor, 120, 520));
        const adaptiveChargeStrength = Math.round(
            Math.min(-150, {{.ChargeStrength}} * (0.7 + spreadFactor * 0.85))
        );
        const adaptiveCollisionPadding = Math.round(
            clamp(
                {{.CollisionPadding}} + maxNodeSize * 0.3 + nodeCount * 0.35,
                {{.CollisionPadding}},
                90
            )
        );
        const adaptiveCenteringStrength = clamp(
            {{.CenteringStrength}} / (0.45 + spreadFactor * 0.75),
            0.008,
            {{.CenteringStrength}}
        );

        // Create force simulation with adaptive parameters
        const linkForce = d3.forceLink(allLinks)
            .id(d => d.id)
            .distance(d => {
                // Package anchor links are shorter to pull components together
                if (d.type === "package-anchor") {
                    return Math.max(25, Math.round(adaptiveLinkDistance * 0.2));
                }
                const sourceCentrality = d.source.centrality || 0;
                const targetCentrality = d.target.centrality || 0;
                const avgCentrality = (sourceCentrality + targetCentrality) / 2;
                return Math.round(adaptiveLinkDistance * (0.82 + (1 - avgCentrality) * 0.9));
            })
            .strength(d => {
                // Package anchor links have fixed strength
                if (d.type === "package-anchor") {
                    return clamp(0.16 + 0.02 * avgDegree, 0.12, 0.32);
                }
                return clamp(1.0 - density * 0.45, 0.45, 0.95);
            });

        const chargeForce = d3.forceManyBody()
            .strength((d) => {
                if (d.isAnchor) {
                    return 0;
                }
                const centrality = d.centrality || 0;
                return adaptiveChargeStrength * (0.7 + centrality * 1.4);
            });

        const collisionForce = d3.forceCollide()
            .radius(d => {
                if (d.isAnchor) {
                    return 0;
                }
                const centrality = d.centrality || 0;
                return (d.renderSize || d.size) + adaptiveCollisionPadding * (0.65 + centrality);
            });

        // AIDEV-NOTE: directional-hints; map centrality to radial rings so high-connectivity nodes stay in the center.
        const radialForce = d3.forceRadial((d) => {
            if (d.isAnchor) {
                return 0;
            }
            return d.ringRadius || minOuter;
        }, width / 2, height / 2).strength((d) => {
            if (d.isAnchor) {
                return 0;
            }
            const centrality = d.centrality || 0;
            // Peripheral nodes get stronger pull to the outskirts, core nodes stay flexible.
            return isPackageView
                ? clamp(0.05 + (1 - centrality) * 0.1, 0.05, 0.15)
                : clamp(0.03 + (1 - centrality) * 0.07, 0.03, 0.1);
        });

        const simulation = d3.forceSimulation(allNodes)
            .force("link", linkForce)
            .force("charge", chargeForce)
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", collisionForce)
            .force("x", d3.forceX(width / 2).strength(adaptiveCenteringStrength))
            .force("y", d3.forceY(height / 2).strength(adaptiveCenteringStrength))
            .force("radial", radialForce);

        // Warm-start with central nodes, then release peripheral nodes.
        const peripheralNodes = visibleNodes.filter(d => !d.isCore);
        peripheralNodes.forEach((node, idx) => {
            const angle = (2 * Math.PI * idx) / Math.max(peripheralNodes.length, 1);
            const r = maxOuter * 0.95;
            node.fx = width / 2 + Math.cos(angle) * r;
            node.fy = height / 2 + Math.sin(angle) * r;
        });

        setTimeout(() => {
            peripheralNodes.forEach((node) => {
                node.fx = null;
                node.fy = null;
            });
            simulation.alpha(0.5).restart();
        }, 700);

        // AIDEV-NOTE: package-hulls - Interactive hull visualization on node click
        const hullGroup = g.append("g").attr("class", "hulls");
        const labelGroup = g.append("g").attr("class", "package-labels");
        let selectedPackage = null;

        function showPackageHull(pkg) {
            selectedPackage = pkg;
            const pkgNodes = visibleNodes.filter(d => d.package === pkg);

            if (pkgNodes.length >= 3) {
                // Draw polygon hull for 3+ nodes
                const points = pkgNodes.map(d => [d.x, d.y]);
                const hull = d3.polygonHull(points);

                if (hull) {
                    const centroid = d3.polygonCentroid(hull);
                    const expanded = hull.map(point => {
                        const dx = point[0] - centroid[0];
                        const dy = point[1] - centroid[1];
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const padding = 30;
                        return [
                            point[0] + (dx / dist) * padding,
                            point[1] + (dy / dist) * padding
                        ];
                    });

                    hullGroup.selectAll("path")
                        .data([{ package: pkg, hull: expanded }])
                        .join("path")
                        .attr("class", "package-hull")
                        .attr("d", d => "M" + d.hull.join("L") + "Z")
                        .attr("fill", colorScale(pkg))
                        .attr("stroke", colorScale(pkg));

                    // Add package label at centroid
                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: centroid[0], y: centroid[1] - 10 }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            } else {
                // For 1-2 nodes, draw expanded circles around each node
                const circles = pkgNodes.map(d => ({
                    x: d.x,
                    y: d.y,
                    radius: d.size * 2.5,
                    package: pkg
                }));

                hullGroup.selectAll("circle")
                    .data(circles)
                    .join("circle")
                    .attr("class", "package-highlight-circle")
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                    .attr("r", d => d.radius)
                    .attr("fill", colorScale(pkg))
                    .attr("stroke", colorScale(pkg));

                // Add package label near the first node
                if (pkgNodes.length > 0) {
                    const labelY = pkgNodes[0].y - pkgNodes[0].size * 3;
                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: pkgNodes[0].x, y: labelY }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            }
        }

        function clearPackageHull() {
            selectedPackage = null;
            hullGroup.selectAll("*").remove();
            labelGroup.selectAll("*").remove();
        }

        // Draw links with arrows (only visible links, not package anchors)
        const link = g.append("g")
            .selectAll("line")
            .data(visibleLinks)
            .join("line")
            .attr("class", d => "link " + d.type)
            .attr("stroke", "#999")
            .attr("marker-end", d => "url(#arrow-" + d.type + ")");

        // Draw nodes (only visible nodes, not anchors)
        const node = g.append("g")
            .selectAll("g")
            .data(visibleNodes)
            .join("g")
            .attr("class", "node")
            .on("click", function(event, d) {
                if (isPackageView) {
                    return;
                }
                event.stopPropagation();
                if (selectedPackage === d.package) {
                    clearPackageHull();
                } else {
                    showPackageHull(d.package);
                }
            })
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        // Render circles for normal components
        node.filter(d => d.type !== "ENTRYPOINT")
            .append("circle")
            .attr("r", d => d.renderSize || d.size)
            .attr("fill", d => colorScale(d.package))
            .attr("stroke", "#fff")
            .attr("stroke-width", 2);

        // Render rectangles for ENTRYPOINT components
        node.filter(d => d.type === "ENTRYPOINT")
            .append("rect")
            .attr("width", d => (d.renderSize || d.size) * 2.5)
            .attr("height", d => (d.renderSize || d.size) * 2.5)
            .attr("x", d => -(d.renderSize || d.size) * 1.25)
            .attr("y", d => -(d.renderSize || d.size) * 1.25)
            .attr("rx", 6)
            .attr("ry", 6)
            .attr("fill", "#dc3545")
            .attr("stroke", "#8b0000")
            .attr("stroke-width", 4);

        node.append("text")
            .text(d => d.name)
            .attr("dy", d => d.type === "ENTRYPOINT" ? (d.renderSize || d.size) * 1.5 + 15 : (d.renderSize || d.size) + 15)
            .attr("font-weight", d => d.type === "ENTRYPOINT" ? "bold" : "normal")
            .attr("font-size", d => d.type === "ENTRYPOINT" ? "14px" : "12px");

        // Add tooltips
        node.append("title")
            .text(d => `${d.name}
Type: ${d.type}
Package: ${d.package}
Role: ${d.role}
Degree: ${d.degree}
In-degree: ${d.inDegree}
Out-degree: ${d.outDegree}`);

        // Add click on background to clear hull
        svg.on("click", function(event) {
            if (event.target === this) {
                clearPackageHull();
            }
        });

        // Update positions on each tick
        simulation.on("tick", () => {
            // Update active hull if one is selected
            if (selectedPackage) {
                showPackageHull(selectedPackage);
            }

            link.each(function(d) {
                // Calculate edge endpoints to stop at node boundaries
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Calculate source edge (rectangles are larger)
                const sourceNodeSize = d.source.renderSize || d.source.size;
                const sourceRadius = d.source.type === "ENTRYPOINT" ? sourceNodeSize * 1.77 : sourceNodeSize;
                const sourceX = d.source.x + (dx / dist) * sourceRadius;
                const sourceY = d.source.y + (dy / dist) * sourceRadius;

                // Calculate target edge (rectangles are larger)
                const targetNodeSize = d.target.renderSize || d.target.size;
                const targetRadius = d.target.type === "ENTRYPOINT" ? targetNodeSize * 1.77 : targetNodeSize;
                const targetX = d.target.x - (dx / dist) * (targetRadius + {{.ArrowHeadDistance}});
                const targetY = d.target.y - (dy / dist) * (targetRadius + {{.ArrowHeadDistance}});

                d3.select(this)
                    .attr("x1", sourceX)
                    .attr("y1", sourceY)
                    .attr("x2", targetX)
                    .attr("y2", targetY);
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
