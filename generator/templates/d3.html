<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{.Title}}</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #graph {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: move;
        }

        .node text {
            font-size: 12px;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .link.dependency {
            stroke-width: 2px;
        }

        .link.implementation {
            stroke-width: 1.5px;
            stroke-dasharray: 5,5;
        }

        .link.package-anchor {
            stroke: none;
            stroke-opacity: 0;
        }

        .package-hull {
            fill-opacity: 0.2;
            stroke-opacity: 0.6;
            stroke-width: 3px;
        }

        .package-label {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }

        .package-highlight-circle {
            fill-opacity: 0.1;
            stroke-opacity: 0.5;
            stroke-width: 2px;
        }

        /* Arrow markers */
        marker {
            fill: #999;
        }

        .controls {
            position: absolute;
            top: 80px;
            left: 20px;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 250px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 3px;
        }

        .control-group .value {
            font-size: 11px;
            color: #666;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 40px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ddd;
        }
    </style>
</head>
<body>
    <h1>{{.Title}}</h1>
    <svg id="graph"></svg>

    <div class="controls">
        <div><strong>Force Parameters</strong></div>
        <div class="control-group">
            <label>Link Distance</label>
            <input type="range" id="linkDistance" min="20" max="200" value="{{.LinkDistance}}">
            <div class="value" id="linkDistanceValue">{{.LinkDistance}}</div>
        </div>
        <div class="control-group">
            <label>Repulsion</label>
            <input type="range" id="chargeStrength" min="-500" max="-50" value="{{.ChargeStrength}}">
            <div class="value" id="chargeStrengthValue">{{.ChargeStrength}}</div>
        </div>
        <div class="control-group">
            <label>Collision Padding</label>
            <input type="range" id="collisionPadding" min="1" max="20" value="{{.CollisionPadding}}">
            <div class="value" id="collisionPaddingValue">{{.CollisionPadding}}</div>
        </div>
        <div class="control-group">
            <label>Package Clustering</label>
            <input type="range" id="packageClustering" min="0" max="1" step="0.05" value="0.3">
            <div class="value" id="packageClusteringValue">0.3</div>
        </div>
    </div>

    <div class="legend" id="legend">
        <div><strong>Packages</strong></div>
    </div>

    <script>
        const data = {{.GraphJSON}};
        const colors = {{.ColorsJSON}};

        // Set up SVG
        const width = window.innerWidth - 40;
        const height = window.innerHeight - 100;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height]);

        // Add zoom behavior
        const g = svg.append("g");
        svg.call(d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform)));

        // Define arrow markers for directed edges
        svg.append("defs").selectAll("marker")
            .data(["dependency", "implementation"])
            .join("marker")
            .attr("id", d => "arrow-" + d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth", {{.ArrowMarkerSize}})
            .attr("markerHeight", {{.ArrowMarkerSize}})
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");

        // Color scale by package (not type)
        const packages = [...new Set(data.nodes.map(n => n.package))];
        const packageColorMap = {};
        packages.forEach((pkg, i) => {
            packageColorMap[pkg] = colors[i % colors.length];
        });

        const colorScale = (pkg) => packageColorMap[pkg] || "#999";

        // AIDEV-NOTE: package-clustering - Create invisible anchor nodes for each package
        // These anchors pull components of the same package together via invisible links
        const packageAnchors = packages.map(pkg => ({
            id: `__anchor_${pkg}`,
            package: pkg,
            isAnchor: true,
            size: 0,
            name: "",
            type: "",
            role: ""
        }));

        // Add anchors to nodes array
        const allNodes = [...data.nodes, ...packageAnchors];

        // Create invisible links from each component to its package anchor
        const packageLinks = data.nodes.map(node => ({
            source: node.id,
            target: `__anchor_${node.package}`,
            type: "package-anchor"
        }));

        // Combine all links
        const allLinks = [...data.links, ...packageLinks];

        // Build dynamic legend
        const legend = d3.select("#legend");

        // Add ENTRYPOINT first if it exists
        const hasEntrypoint = data.nodes.some(n => n.type === "ENTRYPOINT");
        if (hasEntrypoint) {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", "#dc3545")
                .style("border-radius", "2px");
            item.append("span").text("entrypoint").style("font-weight", "bold");
        }

        // Add package colors
        packages.filter(pkg => pkg !== "main").forEach((pkg, i) => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", colors[i % colors.length]);
            item.append("span").text(pkg);
        });

        // Create force simulation with configurable parameters
        let linkDistanceValue = {{.LinkDistance}};
        let chargeStrengthValue = {{.ChargeStrength}};
        let collisionPaddingValue = {{.CollisionPadding}};
        let packageClusteringValue = 0.3;

        const linkForce = d3.forceLink(allLinks)
            .id(d => d.id)
            .distance(d => {
                // Package anchor links are shorter to pull components together
                if (d.type === "package-anchor") {
                    return 30;
                }
                return linkDistanceValue;
            })
            .strength(d => {
                // Package anchor links have configurable strength
                if (d.type === "package-anchor") {
                    return packageClusteringValue;
                }
                return 1;
            });

        const chargeForce = d3.forceManyBody()
            .strength(chargeStrengthValue);

        const collisionForce = d3.forceCollide()
            .radius(d => d.size + collisionPaddingValue);

        const simulation = d3.forceSimulation(allNodes)
            .force("link", linkForce)
            .force("charge", chargeForce)
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", collisionForce)
            .force("x", d3.forceX(width / 2).strength({{.CenteringStrength}}))
            .force("y", d3.forceY(height / 2).strength({{.CenteringStrength}}));

        // Wire up slider controls
        d3.select("#linkDistance").on("input", function() {
            linkDistanceValue = +this.value;
            d3.select("#linkDistanceValue").text(linkDistanceValue);
            linkForce.distance(linkDistanceValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#chargeStrength").on("input", function() {
            chargeStrengthValue = +this.value;
            d3.select("#chargeStrengthValue").text(chargeStrengthValue);
            chargeForce.strength(chargeStrengthValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#collisionPadding").on("input", function() {
            collisionPaddingValue = +this.value;
            d3.select("#collisionPaddingValue").text(collisionPaddingValue);
            collisionForce.radius(d => d.size + collisionPaddingValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#packageClustering").on("input", function() {
            packageClusteringValue = +this.value;
            d3.select("#packageClusteringValue").text(packageClusteringValue);
            linkForce.strength(d => {
                if (d.type === "package-anchor") {
                    return packageClusteringValue;
                }
                return 1;
            });
            simulation.alpha(0.3).restart();
        });

        // AIDEV-NOTE: package-hulls - Interactive hull visualization on node click
        const hullGroup = g.append("g").attr("class", "hulls");
        const labelGroup = g.append("g").attr("class", "package-labels");
        let selectedPackage = null;

        function showPackageHull(pkg) {
            selectedPackage = pkg;
            const pkgNodes = visibleNodes.filter(d => d.package === pkg);

            if (pkgNodes.length >= 3) {
                // Draw polygon hull for 3+ nodes
                const points = pkgNodes.map(d => [d.x, d.y]);
                const hull = d3.polygonHull(points);

                if (hull) {
                    const centroid = d3.polygonCentroid(hull);
                    const expanded = hull.map(point => {
                        const dx = point[0] - centroid[0];
                        const dy = point[1] - centroid[1];
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const padding = 30;
                        return [
                            point[0] + (dx / dist) * padding,
                            point[1] + (dy / dist) * padding
                        ];
                    });

                    hullGroup.selectAll("path")
                        .data([{ package: pkg, hull: expanded }])
                        .join("path")
                        .attr("class", "package-hull")
                        .attr("d", d => "M" + d.hull.join("L") + "Z")
                        .attr("fill", colorScale(pkg))
                        .attr("stroke", colorScale(pkg));

                    // Add package label at centroid
                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: centroid[0], y: centroid[1] - 10 }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            } else {
                // For 1-2 nodes, draw expanded circles around each node
                const circles = pkgNodes.map(d => ({
                    x: d.x,
                    y: d.y,
                    radius: d.size * 2.5,
                    package: pkg
                }));

                hullGroup.selectAll("circle")
                    .data(circles)
                    .join("circle")
                    .attr("class", "package-highlight-circle")
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                    .attr("r", d => d.radius)
                    .attr("fill", colorScale(pkg))
                    .attr("stroke", colorScale(pkg));

                // Add package label near the first node
                if (pkgNodes.length > 0) {
                    const labelY = pkgNodes[0].y - pkgNodes[0].size * 3;
                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: pkgNodes[0].x, y: labelY }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            }
        }

        function clearPackageHull() {
            selectedPackage = null;
            hullGroup.selectAll("*").remove();
            labelGroup.selectAll("*").remove();
        }

        // Draw links with arrows (only visible links, not package anchors)
        const visibleLinks = allLinks.filter(d => d.type !== "package-anchor");
        const link = g.append("g")
            .selectAll("line")
            .data(visibleLinks)
            .join("line")
            .attr("class", d => "link " + d.type)
            .attr("stroke", "#999")
            .attr("marker-end", d => "url(#arrow-" + d.type + ")");

        // Draw nodes (only visible nodes, not anchors)
        const visibleNodes = allNodes.filter(d => !d.isAnchor);
        const node = g.append("g")
            .selectAll("g")
            .data(visibleNodes)
            .join("g")
            .attr("class", "node")
            .on("click", function(event, d) {
                event.stopPropagation();
                if (selectedPackage === d.package) {
                    clearPackageHull();
                } else {
                    showPackageHull(d.package);
                }
            })
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        // Render circles for normal components
        node.filter(d => d.type !== "ENTRYPOINT")
            .append("circle")
            .attr("r", d => d.size)
            .attr("fill", d => colorScale(d.package))
            .attr("stroke", "#fff")
            .attr("stroke-width", 2);

        // Render rectangles for ENTRYPOINT components
        node.filter(d => d.type === "ENTRYPOINT")
            .append("rect")
            .attr("width", d => d.size * 2.5)
            .attr("height", d => d.size * 2.5)
            .attr("x", d => -d.size * 1.25)
            .attr("y", d => -d.size * 1.25)
            .attr("rx", 6)
            .attr("ry", 6)
            .attr("fill", "#dc3545")
            .attr("stroke", "#8b0000")
            .attr("stroke-width", 4);

        node.append("text")
            .text(d => d.name)
            .attr("dy", d => d.type === "ENTRYPOINT" ? d.size * 1.5 + 15 : d.size + 15)
            .attr("font-weight", d => d.type === "ENTRYPOINT" ? "bold" : "normal")
            .attr("font-size", d => d.type === "ENTRYPOINT" ? "14px" : "12px");

        // Add tooltips
        node.append("title")
            .text(d => `${d.name}
Type: ${d.type}
Package: ${d.package}
Role: ${d.role}`);

        // Add click on background to clear hull
        svg.on("click", function(event) {
            if (event.target === this) {
                clearPackageHull();
            }
        });

        // Update positions on each tick
        simulation.on("tick", () => {
            // Update active hull if one is selected
            if (selectedPackage) {
                showPackageHull(selectedPackage);
            }

            link.each(function(d) {
                // Calculate edge endpoints to stop at node boundaries
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Calculate source edge (rectangles are larger)
                const sourceRadius = d.source.type === "ENTRYPOINT" ? d.source.size * 1.77 : d.source.size;
                const sourceX = d.source.x + (dx / dist) * sourceRadius;
                const sourceY = d.source.y + (dy / dist) * sourceRadius;

                // Calculate target edge (rectangles are larger)
                const targetRadius = d.target.type === "ENTRYPOINT" ? d.target.size * 1.77 : d.target.size;
                const targetX = d.target.x - (dx / dist) * (targetRadius + {{.ArrowHeadDistance}});
                const targetY = d.target.y - (dy / dist) * (targetRadius + {{.ArrowHeadDistance}});

                d3.select(this)
                    .attr("x1", sourceX)
                    .attr("y1", sourceY)
                    .attr("x2", targetX)
                    .attr("y2", targetY);
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
