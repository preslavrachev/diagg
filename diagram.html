<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Component Diagram - diagg</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #graph {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: move;
        }

        .node text {
            font-size: 12px;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .link.dependency {
            stroke-width: 2px;
        }

        .link.implementation {
            stroke-width: 1.5px;
            stroke-dasharray: 5,5;
        }

        .link.package-anchor {
            stroke: none;
            stroke-opacity: 0;
        }

         
        marker {
            fill: #999;
        }

        .controls {
            position: absolute;
            top: 80px;
            left: 20px;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 250px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 3px;
        }

        .control-group .value {
            font-size: 11px;
            color: #666;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 40px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ddd;
        }
    </style>
</head>
<body>
    <h1>Component Diagram - diagg</h1>
    <svg id="graph"></svg>

    <div class="controls">
        <div><strong>Force Parameters</strong></div>
        <div class="control-group">
            <label>Link Distance</label>
            <input type="range" id="linkDistance" min="20" max="200" value="80">
            <div class="value" id="linkDistanceValue">80</div>
        </div>
        <div class="control-group">
            <label>Repulsion</label>
            <input type="range" id="chargeStrength" min="-500" max="-50" value="-150">
            <div class="value" id="chargeStrengthValue">-150</div>
        </div>
        <div class="control-group">
            <label>Collision Padding</label>
            <input type="range" id="collisionPadding" min="1" max="20" value="3">
            <div class="value" id="collisionPaddingValue">3</div>
        </div>
        <div class="control-group">
            <label>Package Clustering</label>
            <input type="range" id="packageClustering" min="0" max="1" step="0.05" value="0.3">
            <div class="value" id="packageClusteringValue">0.3</div>
        </div>
    </div>

    <div class="legend" id="legend">
        <div><strong>Packages</strong></div>
    </div>

    <script>
        const data = {"nodes":[{"id":"Config","name":"Config","type":"COMPONENT","package":"config","role":"central","size":26},{"id":"ComponentPatterns","name":"ComponentPatterns","type":"COMPONENT","package":"config","role":"ordinary","size":12},{"id":"ComponentDescriptions","name":"ComponentDescriptions","type":"COMPONENT","package":"config","role":"ordinary","size":12},{"id":"TechnologyInference","name":"TechnologyInference","type":"COMPONENT","package":"config","role":"ordinary","size":12},{"id":"VisualStyling","name":"VisualStyling","type":"COMPONENT","package":"config","role":"ordinary","size":14},{"id":"D3Styling","name":"D3Styling","type":"COMPONENT","package":"config","role":"ordinary","size":12},{"id":"DefaultValues","name":"DefaultValues","type":"COMPONENT","package":"config","role":"ordinary","size":12},{"id":"Component","name":"Component","type":"COMPONENT","package":"parser","role":"ordinary","size":20},{"id":"Field","name":"Field","type":"COMPONENT","package":"parser","role":"ordinary","size":14},{"id":"Method","name":"Method","type":"COMPONENT","package":"parser","role":"ordinary","size":14},{"id":"InterfaceMethod","name":"InterfaceMethod","type":"COMPONENT","package":"parser","role":"ordinary","size":10},{"id":"Parser","name":"Parser","type":"COMPONENT","package":"parser","role":"leaf","size":18},{"id":"PackageTypeInfo","name":"PackageTypeInfo","type":"COMPONENT","package":"parser","role":"ordinary","size":14},{"id":"ComponentType","name":"ComponentType","type":"COMPONENT","package":"analyzer","role":"ordinary","size":18},{"id":"AnalyzedComponent","name":"AnalyzedComponent","type":"COMPONENT","package":"analyzer","role":"central","size":28},{"id":"Dependency","name":"Dependency","type":"COMPONENT","package":"analyzer","role":"ordinary","size":18},{"id":"InterfaceImplementation","name":"InterfaceImplementation","type":"COMPONENT","package":"analyzer","role":"ordinary","size":12},{"id":"Analyzer","name":"Analyzer","type":"COMPONENT","package":"analyzer","role":"leaf","size":22},{"id":"ComponentMetrics","name":"ComponentMetrics","type":"COMPONENT","package":"analyzer","role":"ordinary","size":12},{"id":"ComponentRole","name":"ComponentRole","type":"COMPONENT","package":"analyzer","role":"ordinary","size":14},{"id":"D3Generator","name":"D3Generator","type":"COMPONENT","package":"generator","role":"leaf","size":18},{"id":"d3Node","name":"d3Node","type":"COMPONENT","package":"generator","role":"ordinary","size":12},{"id":"d3Link","name":"d3Link","type":"COMPONENT","package":"generator","role":"ordinary","size":12},{"id":"d3Graph","name":"d3Graph","type":"COMPONENT","package":"generator","role":"ordinary","size":16},{"id":"templateData","name":"templateData","type":"COMPONENT","package":"generator","role":"ordinary","size":10},{"id":"Generator","name":"Generator","type":"COMPONENT","package":"generator","role":"ordinary","size":14},{"id":"PlantUMLGenerator","name":"PlantUMLGenerator","type":"COMPONENT","package":"generator","role":"leaf","size":22}],"links":[{"source":"Config","target":"ComponentPatterns","type":"dependency"},{"source":"Config","target":"ComponentDescriptions","type":"dependency"},{"source":"Config","target":"TechnologyInference","type":"dependency"},{"source":"Config","target":"VisualStyling","type":"dependency"},{"source":"Config","target":"DefaultValues","type":"dependency"},{"source":"VisualStyling","target":"D3Styling","type":"dependency"},{"source":"Component","target":"Field","type":"dependency"},{"source":"Component","target":"Method","type":"dependency"},{"source":"Parser","target":"Component","type":"dependency"},{"source":"Parser","target":"Field","type":"dependency"},{"source":"Parser","target":"PackageTypeInfo","type":"dependency"},{"source":"Parser","target":"Method","type":"dependency"},{"source":"AnalyzedComponent","target":"Component","type":"dependency"},{"source":"AnalyzedComponent","target":"ComponentType","type":"dependency"},{"source":"AnalyzedComponent","target":"Dependency","type":"dependency"},{"source":"AnalyzedComponent","target":"InterfaceImplementation","type":"dependency"},{"source":"AnalyzedComponent","target":"ComponentMetrics","type":"dependency"},{"source":"AnalyzedComponent","target":"ComponentRole","type":"dependency"},{"source":"Dependency","target":"ComponentType","type":"dependency"},{"source":"Analyzer","target":"Config","type":"dependency"},{"source":"Analyzer","target":"Component","type":"dependency"},{"source":"Analyzer","target":"AnalyzedComponent","type":"dependency"},{"source":"Analyzer","target":"ComponentType","type":"dependency"},{"source":"Analyzer","target":"Dependency","type":"dependency"},{"source":"Analyzer","target":"PackageTypeInfo","type":"dependency"},{"source":"D3Generator","target":"Config","type":"dependency"},{"source":"D3Generator","target":"AnalyzedComponent","type":"dependency"},{"source":"D3Generator","target":"d3Graph","type":"dependency"},{"source":"D3Generator","target":"Generator","type":"implementation"},{"source":"d3Graph","target":"d3Node","type":"dependency"},{"source":"d3Graph","target":"d3Link","type":"dependency"},{"source":"PlantUMLGenerator","target":"Config","type":"dependency"},{"source":"PlantUMLGenerator","target":"AnalyzedComponent","type":"dependency"},{"source":"PlantUMLGenerator","target":"ComponentRole","type":"dependency"},{"source":"PlantUMLGenerator","target":"Dependency","type":"dependency"},{"source":"PlantUMLGenerator","target":"ComponentType","type":"dependency"},{"source":"PlantUMLGenerator","target":"Generator","type":"implementation"}]};
        const colors = ["#4285f4","#ea4335","#34a853","#fbbc04","#9c27b0","#00bcd4","#ff6d00","#795548","#e91e63","#009688","#3f51b5","#8bc34a","#ff9800","#607d8b","#f44336","#2196f3","#cddc39","#673ab7","#00e676","#ffc107","#03a9f4","#ff5722","#9e9e9e","#ffeb3b","#e040fb","#1de9b6","#ffab40","#536dfe","#b2ff59","#ff6e40"];

        
        const width = window.innerWidth - 40;
        const height = window.innerHeight - 100;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height]);

        
        const g = svg.append("g");
        svg.call(d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform)));

        
        svg.append("defs").selectAll("marker")
            .data(["dependency", "implementation"])
            .join("marker")
            .attr("id", d => "arrow-" + d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth",  6 )
            .attr("markerHeight",  6 )
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");

        
        const packages = [...new Set(data.nodes.map(n => n.package))];
        const packageColorMap = {};
        packages.forEach((pkg, i) => {
            packageColorMap[pkg] = colors[i % colors.length];
        });

        const colorScale = (pkg) => packageColorMap[pkg] || "#999";

        
        
        const packageAnchors = packages.map(pkg => ({
            id: `__anchor_${pkg}`,
            package: pkg,
            isAnchor: true,
            size: 0,
            name: "",
            type: "",
            role: ""
        }));

        
        const allNodes = [...data.nodes, ...packageAnchors];

        
        const packageLinks = data.nodes.map(node => ({
            source: node.id,
            target: `__anchor_${node.package}`,
            type: "package-anchor"
        }));

        
        const allLinks = [...data.links, ...packageLinks];

        
        const legend = d3.select("#legend");
        packages.forEach((pkg, i) => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", colors[i % colors.length]);
            item.append("span").text(pkg);
        });

        
        let linkDistanceValue =  80 ;
        let chargeStrengthValue =  -150 ;
        let collisionPaddingValue =  3 ;
        let packageClusteringValue = 0.3;

        const linkForce = d3.forceLink(allLinks)
            .id(d => d.id)
            .distance(d => {
                
                if (d.type === "package-anchor") {
                    return 30;
                }
                return linkDistanceValue;
            })
            .strength(d => {
                
                if (d.type === "package-anchor") {
                    return packageClusteringValue;
                }
                return 1;
            });

        const chargeForce = d3.forceManyBody()
            .strength(chargeStrengthValue);

        const collisionForce = d3.forceCollide()
            .radius(d => d.size + collisionPaddingValue);

        const simulation = d3.forceSimulation(allNodes)
            .force("link", linkForce)
            .force("charge", chargeForce)
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", collisionForce)
            .force("x", d3.forceX(width / 2).strength( 0.03 ))
            .force("y", d3.forceY(height / 2).strength( 0.03 ));

        
        d3.select("#linkDistance").on("input", function() {
            linkDistanceValue = +this.value;
            d3.select("#linkDistanceValue").text(linkDistanceValue);
            linkForce.distance(linkDistanceValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#chargeStrength").on("input", function() {
            chargeStrengthValue = +this.value;
            d3.select("#chargeStrengthValue").text(chargeStrengthValue);
            chargeForce.strength(chargeStrengthValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#collisionPadding").on("input", function() {
            collisionPaddingValue = +this.value;
            d3.select("#collisionPaddingValue").text(collisionPaddingValue);
            collisionForce.radius(d => d.size + collisionPaddingValue);
            simulation.alpha(0.3).restart();
        });

        d3.select("#packageClustering").on("input", function() {
            packageClusteringValue = +this.value;
            d3.select("#packageClusteringValue").text(packageClusteringValue);
            linkForce.strength(d => {
                if (d.type === "package-anchor") {
                    return packageClusteringValue;
                }
                return 1;
            });
            simulation.alpha(0.3).restart();
        });

        
        const visibleLinks = allLinks.filter(d => d.type !== "package-anchor");
        const link = g.append("g")
            .selectAll("line")
            .data(visibleLinks)
            .join("line")
            .attr("class", d => "link " + d.type)
            .attr("stroke", "#999")
            .attr("marker-end", d => "url(#arrow-" + d.type + ")");

        
        const visibleNodes = allNodes.filter(d => !d.isAnchor);
        const node = g.append("g")
            .selectAll("g")
            .data(visibleNodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.size)
            .attr("fill", d => colorScale(d.package));

        node.append("text")
            .text(d => d.name)
            .attr("dy", d => d.size + 15);

        
        node.append("title")
            .text(d => `${d.name}
Type: ${d.type}
Package: ${d.package}
Role: ${d.role}`);

        
        simulation.on("tick", () => {
            link.each(function(d) {
                
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                
                const sourceX = d.source.x + (dx / dist) * d.source.size;
                const sourceY = d.source.y + (dy / dist) * d.source.size;

                
                const targetX = d.target.x - (dx / dist) * (d.target.size +  8 );
                const targetY = d.target.y - (dy / dist) * (d.target.size +  8 );

                d3.select(this)
                    .attr("x1", sourceX)
                    .attr("y1", sourceY)
                    .attr("x2", targetX)
                    .attr("y2", targetY);
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
