<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Package Diagram - diagg</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #graph {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            cursor: move;
        }

        .node text {
            font-size: 12px;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .link.dependency {
            stroke-width: 2px;
        }

        .link.implementation {
            stroke-width: 1.5px;
            stroke-dasharray: 5,5;
        }

        .link.package-anchor {
            stroke: none;
            stroke-opacity: 0;
        }

        .package-hull {
            fill-opacity: 0.2;
            stroke-opacity: 0.6;
            stroke-width: 3px;
        }

        .package-label {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }

        .package-highlight-circle {
            fill-opacity: 0.1;
            stroke-opacity: 0.5;
            stroke-width: 2px;
        }


        marker {
            fill: #999;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 40px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ddd;
        }
    </style>
</head>
<body>
    <h1>Package Diagram - diagg</h1>
    <svg id="graph"></svg>

    <div class="legend" id="legend">
        <div><strong>Packages</strong></div>
    </div>

    <script>
        const data = {"nodes":[{"id":"github.com/preslavrachev/diagg/analyzer","name":"github.com/preslavrachev/diagg/analyzer (analyzer)","type":"PACKAGE","package":"github.com/preslavrachev/diagg/analyzer","role":"central","size":18,"main":false},{"id":"github.com/preslavrachev/diagg/config","name":"github.com/preslavrachev/diagg/config (config)","type":"PACKAGE","package":"github.com/preslavrachev/diagg/config","role":"hub","size":16,"main":false},{"id":"github.com/preslavrachev/diagg/parser","name":"github.com/preslavrachev/diagg/parser (parser)","type":"PACKAGE","package":"github.com/preslavrachev/diagg/parser","role":"ordinary","size":14,"main":false},{"id":"github.com/preslavrachev/diagg/generator","name":"github.com/preslavrachev/diagg/generator (generator)","type":"PACKAGE","package":"github.com/preslavrachev/diagg/generator","role":"ordinary","size":16,"main":false},{"id":"github.com/preslavrachev/diagg/cmd/diagg","name":"github.com/preslavrachev/diagg/cmd/diagg (main)","type":"PACKAGE","package":"github.com/preslavrachev/diagg/cmd/diagg","role":"leaf","size":18,"main":false}],"links":[{"source":"github.com/preslavrachev/diagg/analyzer","target":"github.com/preslavrachev/diagg/config","type":"dependency"},{"source":"github.com/preslavrachev/diagg/analyzer","target":"github.com/preslavrachev/diagg/parser","type":"dependency"},{"source":"github.com/preslavrachev/diagg/generator","target":"github.com/preslavrachev/diagg/analyzer","type":"dependency"},{"source":"github.com/preslavrachev/diagg/generator","target":"github.com/preslavrachev/diagg/config","type":"dependency"},{"source":"github.com/preslavrachev/diagg/cmd/diagg","target":"github.com/preslavrachev/diagg/analyzer","type":"dependency"},{"source":"github.com/preslavrachev/diagg/cmd/diagg","target":"github.com/preslavrachev/diagg/config","type":"dependency"},{"source":"github.com/preslavrachev/diagg/cmd/diagg","target":"github.com/preslavrachev/diagg/generator","type":"dependency"},{"source":"github.com/preslavrachev/diagg/cmd/diagg","target":"github.com/preslavrachev/diagg/parser","type":"dependency"}]};
        const colors = ["#4285f4","#ea4335","#34a853","#fbbc04","#9c27b0","#00bcd4","#ff6d00","#795548","#e91e63","#009688","#3f51b5","#8bc34a","#ff9800","#607d8b","#f44336","#2196f3","#cddc39","#673ab7","#00e676","#ffc107","#03a9f4","#ff5722","#9e9e9e","#ffeb3b","#e040fb","#1de9b6","#ffab40","#536dfe","#b2ff59","#ff6e40"];
        const viewMode = "package";
        const isPackageView = viewMode === "package";


        const width = window.innerWidth - 40;
        const height = window.innerHeight - 100;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height]);


        const g = svg.append("g");
        svg.call(d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform)));


        svg.append("defs").selectAll("marker")
            .data(["dependency", "implementation"])
            .join("marker")
            .attr("id", d => "arrow-" + d)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("markerWidth",  6 )
            .attr("markerHeight",  6 )
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#999");


        const packages = [...new Set(data.nodes.map(n => n.package))];
        const packageColorMap = {};
        packages.forEach((pkg, i) => {
            packageColorMap[pkg] = colors[i % colors.length];
        });

        const colorScale = (pkg) => packageColorMap[pkg] || "#999";



        const packageAnchors = isPackageView ? [] : packages.map(pkg => ({
            id: `__anchor_${pkg}`,
            package: pkg,
            isAnchor: true,
            size: 0,
            name: "",
            type: "",
            role: ""
        }));


        const allNodes = [...data.nodes, ...packageAnchors];


        const packageLinks = isPackageView ? [] : data.nodes.map(node => ({
            source: node.id,
            target: `__anchor_${node.package}`,
            type: "package-anchor"
        }));


        const allLinks = [...data.links, ...packageLinks];


        const legend = d3.select("#legend");


        const hasEntrypoint = !isPackageView && data.nodes.some(n => n.type === "ENTRYPOINT");
        if (hasEntrypoint) {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", "#dc3545")
                .style("border-radius", "2px");
            item.append("span").text("entrypoint").style("font-weight", "bold");
        }


        packages.filter(pkg => isPackageView || pkg !== "main").forEach((pkg, i) => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background", colors[i % colors.length]);
            item.append("span").text(pkg);
        });

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }


        const visibleLinks = allLinks.filter(d => d.type !== "package-anchor");
        const nodeCount = Math.max(1, data.nodes.length);
        const edgeCount = visibleLinks.length;
        const density = nodeCount > 1 ? edgeCount / (nodeCount * (nodeCount - 1)) : 0;
        const avgDegree = (2 * edgeCount) / nodeCount;
        const maxNodeSize = d3.max(data.nodes, d => d.size) || 10;

        const spreadFactor = clamp(
            1 + (nodeCount / 18) + (density * 2.5) + (avgDegree / 6),
            1.0,
            4.0
        );

        const adaptiveLinkDistance = Math.round(clamp( 150  * spreadFactor, 120, 520));
        const adaptiveChargeStrength = Math.round(
            Math.min(-150,  -800  * (0.7 + spreadFactor * 0.85))
        );
        const adaptiveCollisionPadding = Math.round(
            clamp(
                 15  + maxNodeSize * 0.3 + nodeCount * 0.35,
                 15 ,
                90
            )
        );
        const adaptiveCenteringStrength = clamp(
             0.05  / (0.45 + spreadFactor * 0.75),
            0.008,
	             0.05
        );


        const linkForce = d3.forceLink(allLinks)
            .id(d => d.id)
            .distance(d => {

                if (d.type === "package-anchor") {
                    return Math.max(25, Math.round(adaptiveLinkDistance * 0.2));
                }
                return adaptiveLinkDistance;
            })
            .strength(d => {

                if (d.type === "package-anchor") {
                    return clamp(0.16 + 0.02 * avgDegree, 0.12, 0.32);
                }
                return clamp(1.0 - density * 0.45, 0.45, 0.95);
            });

        const chargeForce = d3.forceManyBody()
            .strength(adaptiveChargeStrength);

        const collisionForce = d3.forceCollide()
            .radius(d => d.size + adaptiveCollisionPadding);


        const radialForce = d3.forceRadial((d) => {
            if (d.isAnchor) {
                return 0;
            }

            const minOuter = Math.min(width, height) * 0.22;
            const maxOuter = Math.min(width, height) * 0.45;

            if (d.role === "hub") {
                return 0;
            }
            if (d.role === "central") {
                return minOuter;
            }
            if (d.role === "leaf") {
                return maxOuter;
            }
            return minOuter + (maxOuter - minOuter) * 0.55;
        }, width / 2, height / 2).strength((d) => {
            if (d.isAnchor) {
                return 0;
            }
            return isPackageView ? 0.085 : 0.05;
        });

        const simulation = d3.forceSimulation(allNodes)
            .force("link", linkForce)
            .force("charge", chargeForce)
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", collisionForce)
            .force("x", d3.forceX(width / 2).strength(adaptiveCenteringStrength))
            .force("y", d3.forceY(height / 2).strength(adaptiveCenteringStrength))
            .force("radial", radialForce);


        const hullGroup = g.append("g").attr("class", "hulls");
        const labelGroup = g.append("g").attr("class", "package-labels");
        let selectedPackage = null;

        function showPackageHull(pkg) {
            selectedPackage = pkg;
            const pkgNodes = visibleNodes.filter(d => d.package === pkg);

            if (pkgNodes.length >= 3) {

                const points = pkgNodes.map(d => [d.x, d.y]);
                const hull = d3.polygonHull(points);

                if (hull) {
                    const centroid = d3.polygonCentroid(hull);
                    const expanded = hull.map(point => {
                        const dx = point[0] - centroid[0];
                        const dy = point[1] - centroid[1];
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const padding = 30;
                        return [
                            point[0] + (dx / dist) * padding,
                            point[1] + (dy / dist) * padding
                        ];
                    });

                    hullGroup.selectAll("path")
                        .data([{ package: pkg, hull: expanded }])
                        .join("path")
                        .attr("class", "package-hull")
                        .attr("d", d => "M" + d.hull.join("L") + "Z")
                        .attr("fill", colorScale(pkg))
                        .attr("stroke", colorScale(pkg));


                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: centroid[0], y: centroid[1] - 10 }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            } else {

                const circles = pkgNodes.map(d => ({
                    x: d.x,
                    y: d.y,
                    radius: d.size * 2.5,
                    package: pkg
                }));

                hullGroup.selectAll("circle")
                    .data(circles)
                    .join("circle")
                    .attr("class", "package-highlight-circle")
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                    .attr("r", d => d.radius)
                    .attr("fill", colorScale(pkg))
                    .attr("stroke", colorScale(pkg));


                if (pkgNodes.length > 0) {
                    const labelY = pkgNodes[0].y - pkgNodes[0].size * 3;
                    labelGroup.selectAll("text")
                        .data([{ package: pkg, x: pkgNodes[0].x, y: labelY }])
                        .join("text")
                        .attr("class", "package-label")
                        .attr("x", d => d.x)
                        .attr("y", d => d.y)
                        .text(d => d.package);
                }
            }
        }

        function clearPackageHull() {
            selectedPackage = null;
            hullGroup.selectAll("*").remove();
            labelGroup.selectAll("*").remove();
        }


        const link = g.append("g")
            .selectAll("line")
            .data(visibleLinks)
            .join("line")
            .attr("class", d => "link " + d.type)
            .attr("stroke", "#999")
            .attr("marker-end", d => "url(#arrow-" + d.type + ")");


        const visibleNodes = allNodes.filter(d => !d.isAnchor);
        const node = g.append("g")
            .selectAll("g")
            .data(visibleNodes)
            .join("g")
            .attr("class", "node")
            .on("click", function(event, d) {
                if (isPackageView) {
                    return;
                }
                event.stopPropagation();
                if (selectedPackage === d.package) {
                    clearPackageHull();
                } else {
                    showPackageHull(d.package);
                }
            })
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));


        node.filter(d => d.type !== "ENTRYPOINT")
            .append("circle")
            .attr("r", d => d.size)
            .attr("fill", d => colorScale(d.package))
            .attr("stroke", "#fff")
            .attr("stroke-width", 2);


        node.filter(d => d.type === "ENTRYPOINT")
            .append("rect")
            .attr("width", d => d.size * 2.5)
            .attr("height", d => d.size * 2.5)
            .attr("x", d => -d.size * 1.25)
            .attr("y", d => -d.size * 1.25)
            .attr("rx", 6)
            .attr("ry", 6)
            .attr("fill", "#dc3545")
            .attr("stroke", "#8b0000")
            .attr("stroke-width", 4);

        node.append("text")
            .text(d => d.name)
            .attr("dy", d => d.type === "ENTRYPOINT" ? d.size * 1.5 + 15 : d.size + 15)
            .attr("font-weight", d => d.type === "ENTRYPOINT" ? "bold" : "normal")
            .attr("font-size", d => d.type === "ENTRYPOINT" ? "14px" : "12px");


        node.append("title")
            .text(d => `${d.name}
Type: ${d.type}
Package: ${d.package}
Role: ${d.role}`);


        svg.on("click", function(event) {
            if (event.target === this) {
                clearPackageHull();
            }
        });


        simulation.on("tick", () => {

            if (selectedPackage) {
                showPackageHull(selectedPackage);
            }

            link.each(function(d) {

                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);


                const sourceRadius = d.source.type === "ENTRYPOINT" ? d.source.size * 1.77 : d.source.size;
                const sourceX = d.source.x + (dx / dist) * sourceRadius;
                const sourceY = d.source.y + (dy / dist) * sourceRadius;


                const targetRadius = d.target.type === "ENTRYPOINT" ? d.target.size * 1.77 : d.target.size;
                const targetX = d.target.x - (dx / dist) * (targetRadius +  8 );
                const targetY = d.target.y - (dy / dist) * (targetRadius +  8 );

                d3.select(this)
                    .attr("x1", sourceX)
                    .attr("y1", sourceY)
                    .attr("x2", targetX)
                    .attr("y2", targetY);
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });


        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
